name: CI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: |
          find . -name "*.sh" -exec shellcheck -e SC1091,SC2086,SC2034,SC2012,SC2035,SC2044,SC2155 {} +

  build-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro lintian
      - name: Build Meta-packages
        run: |
          chmod +x packaging/build-debs.sh
          ./packaging/build-debs.sh
      - name: Lint Packages
        run: |
          lintian packaging/build/debs/*.deb --info --display-info || true
      - name: Import into Repository
        env:
          CTXOS_ARCHIVE_PRIVATE_KEY: ${{ secrets.CTXOS_ARCHIVE_PRIVATE_KEY }}
        run: |
          if [ -z "$CTXOS_ARCHIVE_PRIVATE_KEY" ]; then
            echo "No signing key available, skipping repository import"
            exit 0
          fi
          export GNUPGHOME=$(mktemp -d)
          chmod 700 "$GNUPGHOME"
          echo "$CTXOS_ARCHIVE_PRIVATE_KEY" | gpg --batch --import
          cd deb.ctxos.github.io
          for deb in ../packaging/build/debs/*.deb; do
            reprepro -b . includedeb noble "$deb"
          done
          reprepro -b . export noble
