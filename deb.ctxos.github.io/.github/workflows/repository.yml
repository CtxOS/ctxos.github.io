name: Build CtxOS APT Repository

on:
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - "conf/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev \
            reprepro \
            gnupg

      - name: Import signing key
        env:
          CTXOS_ARCHIVE_PRIVATE_KEY: ${{ secrets.CTXOS_ARCHIVE_PRIVATE_KEY }}
        run: |
          if [ -z "${CTXOS_ARCHIVE_PRIVATE_KEY}" ]; then
            echo "error: CTXOS_ARCHIVE_PRIVATE_KEY secret is not configured"
            exit 1
          fi

          mkdir -p "$HOME/.gnupg"
          chmod 700 "$HOME/.gnupg"

          printf '%s\n' "${CTXOS_ARCHIVE_PRIVATE_KEY}" \
            | gpg --batch --import

      - name: Build packages
        run: |
          ./scripts/build-packages.sh

      - name: Build repository
        run: |
          ./scripts/build-repository.sh

      - name: Verify repository
        run: |
          test -f public/dists/noble/InRelease
          test -f public/dists/noble/Release

      - name: Upload repository artifact
        uses: actions/upload-artifact@v4
        with:
          name: apt-repository
          path: |
            public/dists
            public/pool

  deploy:
    needs: build
    if: github.repository == 'CtxOS/deb.ctxos.github.io'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download repository artifact
        uses: actions/download-artifact@v4
        with:
          name: apt-repository
          path: public

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
